<!DOCTYPE html>
<html lang="zh-CN">

<head th:replace="~{fragments/head :: head(${category.spec.displayName + ' | ' + site.title}, ${null}, ${null})}"></head>

<body>
    <header th:replace="~{fragments/header :: header}"></header>

    <main id="main-content" class="main">
        <header th:replace="~{fragments/second-menu :: secondMenu(${category.spec.displayName})}"></header>

        <ul class="post-list" th:if="${posts != null && !#lists.isEmpty(posts.items)}">
            <li th:each="post : ${posts.items}" class="post-item">
                <a th:text="${post.spec.title}" th:href="@{${post.status.permalink}}"></a>
                <span class="post-date" th:text="${#dates.format(post.spec.publishTime, 'yyyy-MM-dd')}"></span>
            </li>
        </ul>
        <div class="empty-state" th:if="${posts == null || #lists.isEmpty(posts.items)}">
            <p>该分类下暂无文章</p>
        </div>
        <div th:replace="~{fragments/pagination :: pagination(${posts})}"></div>
    </main>

    <footer th:replace="~{fragments/footer :: footer}"></footer>
    <script th:src="@{/assets/js/main.js}"></script>
</body>

</html>
