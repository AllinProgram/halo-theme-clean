<head th:fragment="head(title, description, url)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" th:content="${description}" th:if="${description != null}">
    <meta name="keywords" th:content="${site.seo.keywords}" th:if="${site.seo != null && site.seo.keywords != null}">
    <title th:text="${title}"></title>
    <link rel="icon" th:href="@{${site.favicon}}" th:if="${site.favicon != null}" />
    <link rel="canonical" th:href="${url}" th:if="${url != null}" />
    <meta property="og:type" content="website" />
    <meta property="og:title" th:content="${title}" />
    <meta property="og:description" th:content="${description}" th:if="${description != null}" />
    <meta property="og:url" th:content="${url}" th:if="${url != null}" />
    <meta property="og:site_name" th:content="${site.title}" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" th:content="${title}" />
    <meta name="twitter:description" th:content="${description}" th:if="${description != null}" />
    <script>
        (function() {
            var THEME_KEY = 'theme-preference';
            var stored = localStorage.getItem(THEME_KEY);
            var theme = stored || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
    <link rel="stylesheet" th:href="@{/assets/css/style.css}" />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC&display=swap" media="all" rel="stylesheet" />
</head>
