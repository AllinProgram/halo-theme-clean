<!DOCTYPE html>
<html lang="zh-CN">

<head th:replace="~{fragments/head :: head(${'标签 | ' + site.title}, ${null}, ${null})}"></head>

<body>
    <header th:replace="~{fragments/header :: header}"></header>

    <main id="main-content" class="main">
        <header th:replace="~{fragments/second-menu :: secondMenu('标签')}"></header>

        <ul class="tag-list" th:if="${tags != null && !#lists.isEmpty(tags)}">
            <li th:each="tag : ${tags}">
                <a th:text="${tag.spec.displayName}" th:href="@{${tag.status.permalink}}"></a>
            </li>
        </ul>
        <div class="empty-state" th:if="${tags == null || #lists.isEmpty(tags)}">
            <p>暂无标签</p>
        </div>
    </main>

    <footer th:replace="~{fragments/footer :: footer}"></footer>
    <script th:src="@{/assets/js/main.js}"></script>
</body>

</html>
